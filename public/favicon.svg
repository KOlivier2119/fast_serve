<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="10" fill="#396C03"/>

  <!-- Bowl base -->
  <path d="M10 22 C10 28 30 28 30 22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bowl rim line -->
  <line x1="8" y1="22" x2="32" y2="22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Chopstick left -->
  <line x1="15" y1="10" x2="15" y2="19" stroke="#FF8B00" stroke-width="2" stroke-linecap="round"/>

  <!-- Chopstick right -->
  <line x1="20" y1="9" x2="20" y2="19" stroke="#FF8B00" stroke-width="2" stroke-linecap="round"/>

  <!-- Speed dash long -->
  <line x1="23" y1="12" x2="29" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Speed dash short -->
  <line x1="25" y1="15.5" x2="29" y2="15.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
